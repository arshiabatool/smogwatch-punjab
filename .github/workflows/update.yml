
name: Update air quality data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Fetch and build data
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit new data
        run: |
          git config user.name "smogwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data data_archive
          git diff --cached --quiet || git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
